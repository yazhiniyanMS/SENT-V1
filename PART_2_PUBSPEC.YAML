## PART 2 — PUBSPEC.YAML

name: sentinel_x
description: AI-Powered Disaster Response System
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  flutter_svg: ^2.0.10+1
  video_player: ^2.8.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.2.0
  permission_handler: ^11.3.0
  google_fonts: ^6.2.1
  shaders: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/sentinel_demo.mp4
    - assets/shaders/thermal.frag
    - assets/icons/
    - assets/images/